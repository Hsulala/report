<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>總誠高空車｜關鍵字群集</title><link rel="stylesheet" href="./style.css"><script src="./workshop.js" defer></script></head>
<body><main>
<header><div><p class="eyebrow">總誠高空車　／　租賃內容規劃</p><h1>高空車租賃關鍵字群集</h1><p class="intro">依租賃決策的問題分群。先看實際字詞與數據，再把現場想討論的項目留下。暫選不會送出正式選字，也不會動用文章額度。</p></div><svg width="160" height="100" viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 88h145M19 73h51v13H19zM44 74l28-37 36 4 26-23M68 71l19-22 22 3 29-21M129 29V16h18v18h-18z"/><circle cx="29" cy="85" r="7"/><circle cx="61" cy="85" r="7"/><circle cx="82" cy="49" r="4"/></svg></header>
<section class="summary" aria-label="候選摘要"><div><b id="total">—</b><span>候選關鍵字</span></div><div><b id="known">—</b><span>有月搜尋量</span></div><div><b id="groups">—</b><span>租賃群集</span></div><div><b id="selected">—</b><span>面訪暫選</span></div></section>
<div class="source"><strong>資料口徑</strong><p id="source">讀取中</p><p>近義詞不加總；廣告競爭不等於 SEO 難度。空白不補 0。</p></div>
<section aria-labelledby="list-title"><h2 id="list-title">逐筆關鍵字</h2><div class="controls"><label>搜尋字詞<input id="q" type="search" placeholder="例如：曲臂、租金"></label><label>分類<select id="category"><option value="">全部群集</option></select></label><label class="check"><input id="only" type="checkbox">只看暫選</label><label class="check"><input id="rec" type="checkbox">只看建議</label></div>
<p id="status" role="status" aria-live="polite"></p><p id="result" class="sub"></p><div id="rows"></div></section>
<section class="lookup" aria-labelledby="lookup-title"><h2 id="lookup-title">查詢清單以外的關鍵字</h2><p>查詢會向 Google Ads 取資料，不會自動寫入。確認相關後才加入面訪候選。</p><form id="look"><label>新關鍵字<input id="term" required maxlength="40" autocomplete="off"></label><button id="go" type="submit">查詢</button></form><div id="look-out" aria-live="polite"></div></section>
<aside class="foot"><strong>先確認三類素材</strong><p>曲臂與直臂的實際案場和規格、可公開的科技廠進場文件、以及一個報修／換車案例。江河代理、論文、公益與 AI 路線調度是品牌佐證，確認後再對外使用。</p></aside>
</main></body></html>
