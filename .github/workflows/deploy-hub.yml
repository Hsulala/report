# 提案自動上線：推到 main 且 hub/ 有變動 → 檢查格式 → 只上線有變動的提案資料夾 → 線上驗證。
# 規格：makarma-operations-console 倉庫的 docs/PROPOSAL-PIPELINE.md。
# 這個檔案放在提案倉庫的 .github/workflows/deploy-hub.yml（本倉庫 docs/report-repo/ 是備份來源）。
name: Deploy proposals to hub

on:
  push:
    branches: [main]
    paths: ['hub/**']
  pull_request:
    paths: ['hub/**']
  workflow_dispatch:
    inputs:
      only:
        description: '只上線這些資料夾（逗號分隔，例如 mdia,homoo）；留空＝hub/ 底下全部'
        required: false

concurrency:
  group: deploy-hub
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: 格式檢查（不上傳）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/deploy-hub.js --root . --dry-run

  deploy:
    name: 上線到 hub
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 找出要上線的資料夾
        id: pick
        env:
          INPUT_ONLY: ${{ github.event.inputs.only }}
          BEFORE: ${{ github.event.before }}
        run: |
          only=""; skip="false"
          if [ -n "$INPUT_ONLY" ]; then
            only="$INPUT_ONLY"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            # 只留下現在還存在的資料夾；被刪掉的提案不會自動下架（要到 hub 後台刪除）
            only=""
            for d in $(git diff --name-only "$BEFORE" "${{ github.sha }}" -- hub | cut -d/ -f2 | sort -u); do
              [ -d "hub/$d" ] && only="${only:+$only,}$d"
            done
            [ -z "$only" ] && skip="true"
          fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: 上線並驗證
        if: steps.pick.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUB_BASE_URL: ${{ vars.HUB_BASE_URL }}
          ONLY: ${{ steps.pick.outputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            node tools/deploy-hub.js --root . --only "$ONLY"
          else
            node tools/deploy-hub.js --root .
          fi
